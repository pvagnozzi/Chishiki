<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chishiki Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f111a;
      --surface:   #1a1d2e;
      --border:    #2a2d3e;
      --accent:    #7c6af7;
      --accent-dim:#4a3fa0;
      --text:      #e0e0e0;
      --text-dim:  #888;
      --user-bg:   #1e3a5f;
      --agent-bg:  #1a1d2e;
      --error:     #e05555;
      --font:      'Segoe UI', system-ui, sans-serif;
      --mono:      'Cascadia Code', 'Fira Code', monospace;
      --radius:    8px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .5px; }
    header h1 span { color: var(--accent); }

    #model-select {
      margin-left: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: var(--radius);
      font-size: .85rem;
      cursor: pointer;
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--error);
      transition: background .3s;
    }
    #status-dot.connected { background: #4caf50; }

    /* ── Messages ───────────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: .93rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user  { align-self: flex-end; background: var(--user-bg); }
    .msg.agent { align-self: flex-start; background: var(--agent-bg); border: 1px solid var(--border); }
    .msg.error { align-self: center; color: var(--error); font-size: .85rem; font-style: italic; }

    .msg .role {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .msg.user .role { color: #7fb3e8; }
    .msg.agent .role { color: var(--accent); }

    /* streaming cursor */
    .cursor::after { content: '▋'; animation: blink .7s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* code blocks inside agent messages */
    .msg code {
      font-family: var(--mono);
      background: rgba(255,255,255,.06);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: .85em;
    }
    .msg pre {
      background: rgba(0,0,0,.35);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      overflow-x: auto;
      margin-top: 6px;
    }
    .msg pre code { background: none; padding: 0; }

    /* ── Input bar ──────────────────────────────────────────────────────── */
    #input-bar {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    #user-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: var(--font);
      font-size: .93rem;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      transition: border-color .2s;
    }
    #user-input:focus { border-color: var(--accent); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      padding: 0 18px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    #send-btn:disabled { opacity: .45; cursor: not-allowed; }
    #send-btn:not(:disabled):hover { background: var(--accent-dim); }

    #clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-dim);
      padding: 0 12px;
      font-size: .85rem;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    #clear-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Empty state ────────────────────────────────────────────────────── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: .9rem;
      pointer-events: none;
    }
    #empty-state .icon { font-size: 2.5rem; }
    #empty-state h2 { font-size: 1rem; font-weight: 500; color: var(--text); }
  </style>
</head>
<body>

<header>
  <div id="status-dot" title="Disconnected"></div>
  <h1>Chishiki <span>Agent</span></h1>
  <select id="model-select">
    <option value="">Loading models…</option>
  </select>
</header>

<div id="messages">
  <div id="empty-state">
    <div class="icon">🧠</div>
    <h2>Chishiki Agent</h2>
    <p>Send a message to start a conversation.</p>
  </div>
</div>

<div id="input-bar">
  <textarea id="user-input" rows="1"
    placeholder="Ask anything… (Enter to send, Shift+Enter for new line)"
    autocomplete="off" spellcheck="true"></textarea>
  <button id="clear-btn" title="Clear conversation">Clear</button>
  <button id="send-btn" disabled>Send</button>
</div>

<!-- SignalR client -->
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  const history = [];          // { role: 'user'|'assistant', content: string }
  let streaming  = false;
  let connection = null;

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('user-input');
  const sendBtn     = document.getElementById('send-btn');
  const clearBtn    = document.getElementById('clear-btn');
  const modelSelect = document.getElementById('model-select');
  const statusDot   = document.getElementById('status-dot');
  const emptyState  = document.getElementById('empty-state');

  // ── Models ───────────────────────────────────────────────────────────────
  async function loadModels() {
    try {
      const resp = await fetch('/v1/models');
      if (!resp.ok) throw new Error(resp.statusText);
      const { data } = await resp.json();
      modelSelect.innerHTML = data.map(m =>
        `<option value="${e(m.id)}">${e(m.id)}</option>`
      ).join('');
    } catch {
      modelSelect.innerHTML = '<option value="local">local</option>';
    }
  }

  // ── SignalR ──────────────────────────────────────────────────────────────
  async function connectSignalR() {
    connection = new signalR.HubConnectionBuilder()
      .withUrl('/ws/chat')
      .withAutomaticReconnect()
      .build();

    connection.onreconnecting(() => setConnected(false));
    connection.onreconnected(()  => setConnected(true));
    connection.onclose(()        => setConnected(false));

    connection.on('ReceiveChunk', chunk => {
      if (chunk?.delta) appendToLastAgent(chunk.delta);
    });

    connection.on('StreamEnd', () => finishStreaming());

    try {
      await connection.start();
      setConnected(true);
    } catch (err) {
      console.error('SignalR connection failed:', err);
      setConnected(false);
    }
  }

  function setConnected(on) {
    statusDot.classList.toggle('connected', on);
    statusDot.title = on ? 'Connected' : 'Disconnected';
  }

  // ── Chat ─────────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    inputEl.value = '';
    autoResize();
    hideEmptyState();

    history.push({ role: 'user', content: text });
    renderMessage('user', text);
    renderAgentPlaceholder();

    streaming = true;
    sendBtn.disabled = true;

    const model = modelSelect.value || 'local';

    // Try SignalR first; fall back to SSE
    if (connection?.state === signalR.HubConnectionState.Connected) {
      try {
        await connection.invoke('StreamChat', model, history);
        return;
      } catch (err) {
        console.warn('SignalR invoke failed, falling back to SSE:', err);
      }
    }

    await streamViaSSE(model, text);
  }

  async function streamViaSSE(model, _text) {
    try {
      const resp = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, messages: history, stream: true }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() ?? '';

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') { finishStreaming(); return; }
          try {
            const chunk = JSON.parse(data);
            if (chunk?.delta) appendToLastAgent(chunk.delta);
          } catch { /* ignore malformed */ }
        }
      }
    } catch (err) {
      appendToLastAgent(`\n\n⚠ ${err.message}`);
    } finally {
      finishStreaming();
    }
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function renderMessage(role, content) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;
    el.innerHTML = `<div class="role">${role === 'user' ? 'You' : 'Agent'}</div>
                    <span>${renderContent(content)}</span>`;
    messagesEl.appendChild(el);
    scroll();
    return el;
  }

  function renderAgentPlaceholder() {
    const el = document.createElement('div');
    el.className = 'msg agent';
    el.id = '__streaming';
    el.innerHTML = `<div class="role">Agent</div><span class="cursor"></span>`;
    messagesEl.appendChild(el);
    scroll();
  }

  function appendToLastAgent(delta) {
    const el = document.getElementById('__streaming');
    if (!el) return;
    const span = el.querySelector('span');
    if (!span) return;
    span.textContent += delta;
    scroll();
  }

  function finishStreaming() {
    const el = document.getElementById('__streaming');
    if (el) {
      el.removeAttribute('id');
      const span = el.querySelector('span');
      if (span) {
        span.classList.remove('cursor');
        history.push({ role: 'assistant', content: span.textContent });
      }
    }
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
    scroll();
  }

  function renderContent(text) {
    // Basic markdown-lite: code fences → <pre><code>
    return e(text)
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function hideEmptyState() {
    if (emptyState?.isConnected) emptyState.remove();
  }

  function scroll() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function e(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Input handling ────────────────────────────────────────────────────────
  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }

  inputEl.addEventListener('input', () => {
    autoResize();
    sendBtn.disabled = !inputEl.value.trim() || streaming;
  });

  inputEl.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  clearBtn.addEventListener('click', () => {
    history.length = 0;
    messagesEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.id = 'empty-state';
    empty.innerHTML = '<div class="icon">🧠</div><h2>Chishiki Agent</h2><p>Send a message to start a conversation.</p>';
    messagesEl.appendChild(empty);
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  loadModels();
  connectSignalR();
  inputEl.focus();
</script>
</body>
</html>
