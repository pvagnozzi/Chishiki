global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: chishiki

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: chishiki-api-web
    static_configs:
      - targets: ["chishiki-api-web:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:8080"]
    metrics_path: /metrics
    scrape_interval: 30s
